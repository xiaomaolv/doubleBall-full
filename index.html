<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>双色球选号器（三合一完整版）</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f7fa;
            text-align: center;
        }

        .card {
            background: #fff;
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.14);
            margin-bottom: 28px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 32px;
            font-size: 30px;
            letter-spacing: 3px;
        }

        /* mode-box 左对齐 */
        .mode-box {
            margin-bottom: 36px;
            font-size: 20px;
            line-height: 2.2;
            letter-spacing: 2px;
            text-align: left;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        .mode-box label {
            display: block;
            margin: 14px 0;
        }

        .ball-group {
            margin: 36px 0;
        }

        .ball-group p {
            font-size: 20px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .ball-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50%;
            margin: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
            letter-spacing: 1px;
        }

        .red-ball {
            background-color: #f44336;
            color: #fff;
        }

        .blue-ball {
            background-color: #2196F3;
            color: #fff;
        }

        .exclude-red {
            background: #ffcccc;
            color: #990000;
        }

        .exclude-blue {
            background: #cce5ff;
            color: #004499;
        }

        .result-line {
            font-size: 30px;
            margin: 32px 0;
            font-weight: 600;
            letter-spacing: 3px;
        }

        /* 抽走信息区左对齐，并加大间距 */
        .extra-info {
            margin-top: 28px;
            margin-bottom: 32px;
            padding: 20px 24px;
            font-size: 19px;
            line-height: 2;
            color: #444;
            letter-spacing: 2px;
            text-align: left;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        .extra-info div {
            margin-bottom: 18px;
        }

        .extra-info div:last-child {
            margin-bottom: 0;
        }

        button {
            padding: 18px 24px;
            font-size: 19px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            margin: 10px 8px;
            letter-spacing: 3px;
        }

        .btn-primary {
            background: #222;
            color: white;
        }

        .btn-reset {
            background: #888;
            color: white;
        }

        .btn-special {
            background: #6b21a8;
            color: #fff;
        }

        .tip {
            color: #666;
            font-size: 17px;
            line-height: 1.9;
            margin-top: 32px;
            letter-spacing: 1px;
        }

        /* 手机适配 */
        @media (max-width: 768px) {
            body {
                margin: 20px auto;
                padding: 0 14px;
            }

            .card {
                padding: 28px 20px;
            }

            h2 {
                font-size: 24px;
                margin-bottom: 24px;
            }

            .mode-box {
                font-size: 18px;
                margin-bottom: 28px;
            }

            .mode-box label {
                margin: 12px 0;
            }

            .ball-item {
                width: 44px;
                height: 44px;
                font-size: 16px;
                margin: 6px;
            }

            .result-line {
                font-size: 24px;
                margin: 24px 0;
            }

            .extra-info {
                font-size: 17px;
                margin-top: 20px;
                margin-bottom: 24px;
                padding: 16px 18px;
            }

            .extra-info div {
                margin-bottom: 20px;
            }

            button {
                width: 100%;
                margin: 12px 0;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>双色球选号器｜三合一</h2>

        <div class="mode-box">
            <label>
                <input type="radio" name="mode" value="random" checked onchange="switchMode()">
                普通随机模式
            </label>
            <label>
                <input type="radio" name="mode" value="exclude" onchange="switchMode()">
                反向排除模式（勾选不要的号码）
            </label>
            <label>
                <input type="radio" name="mode" value="remain" onchange="switchMode()">
                抽取27红15蓝，取剩余一注
            </label>
        </div>

        <div id="excludePanel" style="display:none;">
            <div class="ball-group">
                <p>红球（1-33），点击勾选【要排除的号码】：</p>
                <div id="redExcludeWrap"></div>
            </div>
            <div class="ball-group">
                <p>蓝球（1-16），点击勾选【要排除的号码】：</p>
                <div id="blueExcludeWrap"></div>
            </div>
        </div>

        <div class="result-line">
            选号结果：
            <span id="resultShow"></span>
        </div>

        <div class="extra-info" id="extraInfo"></div>

        <div>
            <button class="btn-primary" onclick="runGenerate()">生成号码</button>
            <button class="btn-special" onclick="runRemainMode()">遗漏法生成</button>
            <button class="btn-reset" onclick="resetAll()">重置</button>
        </div>

        <p class="tip">提示：彩票开奖完全随机，本工具仅号码模拟，无法提高中奖概率，理性购彩。</p>
    </div>

<script>
function generateDoubleBall(redBallNum = 6, blueBallNum = 1, excludeRed = [], excludeBlue = []) {
    let availableRed = [];
    for (let i = 1; i <= 33; i++) {
        if (!excludeRed.includes(i)) availableRed.push(i);
    }
    if (availableRed.length < redBallNum) {
        throw new Error("剩余可选红球数量不足，请减少排除号码！");
    }

    let redBalls = [];
    while (redBalls.length < redBallNum) {
        let randIdx = Math.floor(Math.random() * availableRed.length);
        let num = availableRed[randIdx];
        if (redBalls.indexOf(num) === -1) {
            redBalls.push(num);
        }
    }

    let availableBlue = [];
    for (let i = 1; i <= 16; i++) {
        if (!excludeBlue.includes(i)) availableBlue.push(i);
    }
    if (availableBlue.length < blueBallNum) {
        throw new Error("剩余可选蓝球数量不足，请减少排除号码！");
    }

    let blueBalls = [];
    while (blueBalls.length < blueBallNum) {
        let randIdx = Math.floor(Math.random() * availableBlue.length);
        let num = availableBlue[randIdx];
        if (blueBalls.indexOf(num) === -1) {
            blueBalls.push(num);
        }
    }

    redBalls.sort(function (a, b) {
        return a - b;
    });

    return [redBalls, blueBalls];
}

let selectedExcludeRed = [];
let selectedExcludeBlue = [];

function switchMode() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const panel = document.getElementById('excludePanel');
    document.getElementById('extraInfo').innerHTML = '';

    if (mode === 'exclude') {
        panel.style.display = 'block';
    } else {
        panel.style.display = 'none';
    }
}

function renderExcludeBoard() {
    const redWrap = document.getElementById('redExcludeWrap');
    const blueWrap = document.getElementById('blueExcludeWrap');

    redWrap.innerHTML = '';
    blueWrap.innerHTML = '';

    for (let i = 1; i <= 33; i++) {
        const span = document.createElement('span');
        span.className = 'ball-item red-ball';
        span.innerText = i;
        span.dataset.val = i;

        if (selectedExcludeRed.indexOf(i) > -1) {
            span.classList.remove('red-ball');
            span.classList.add('exclude-red');
        }

        span.onclick = function () {
            const val = Number(span.dataset.val);
            const idx = selectedExcludeRed.indexOf(val);

            if (idx > -1) {
                selectedExcludeRed.splice(idx, 1);
            } else {
                selectedExcludeRed.push(val);
            }

            renderExcludeBoard();
        };

        redWrap.appendChild(span);
    }

    for (let i = 1; i <= 16; i++) {
        const span = document.createElement('span');
        span.className = 'ball-item blue-ball';
        span.innerText = i;
        span.dataset.val = i;

        if (selectedExcludeBlue.indexOf(i) > -1) {
            span.classList.remove('blue-ball');
            span.classList.add('exclude-blue');
        }

        span.onclick = function () {
            const val = Number(span.dataset.val);
            const idx = selectedExcludeBlue.indexOf(val);

            if (idx > -1) {
                selectedExcludeBlue.splice(idx, 1);
            } else {
                selectedExcludeBlue.push(val);
            }

            renderExcludeBoard();
        };

        blueWrap.appendChild(span);
    }
}

function runGenerate() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    let excludeR = [];
    let excludeB = [];

    document.getElementById('extraInfo').innerHTML = '';

    if (mode === 'exclude') {
        excludeR = selectedExcludeRed;
        excludeB = selectedExcludeBlue;
    }

    try {
        const result = generateDoubleBall(6, 1, excludeR, excludeB);
        const red = result[0];
        const blue = result[1];

        renderResult(red, blue);
    } catch (e) {
        alert(e.message);
    }
}

function runRemainMode() {
    document.querySelector('input[value="remain"]').checked = true;
    switchMode();

    const picked = generateDoubleBall(27, 15);
    const pickedRed = picked[0];
    const pickedBlue = picked[1];

    let remainRed = [];
    for (let i = 1; i <= 33; i++) {
        if (pickedRed.indexOf(i) === -1) {
            remainRed.push(i);
        }
    }
    remainRed.sort(function (a, b) {
        return a - b;
    });

    let remainBlue = [];
    for (let i = 1; i <= 16; i++) {
        if (pickedBlue.indexOf(i) === -1) {
            remainBlue.push(i);
        }
    }

    renderResult(remainRed, remainBlue);

    document.getElementById('extraInfo').innerHTML =
        '<div>抽走27红：' + pickedRed.join(" ") + '</div>' +
        '<div>抽走15蓝：' + pickedBlue.join(" ") + '</div>';
}

function renderResult(red, blue) {
    let html = '';

    for (let i = 0; i < red.length; i++) {
        html += '<span class="ball-item red-ball">' + red[i] + '</span>';
    }

    for (let i = 0; i < blue.length; i++) {
        html += '<span class="ball-item blue-ball">' + blue[i] + '</span>';
    }

    document.getElementById('resultShow').innerHTML = html;
}

function resetAll() {
    selectedExcludeRed = [];
    selectedExcludeBlue = [];
    document.getElementById('resultShow').innerHTML = '';
    document.getElementById('extraInfo').innerHTML = '';
    renderExcludeBoard();
}

renderExcludeBoard();
</script>
</body>
</html>
